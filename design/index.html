<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>m.fi — intent credit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ===================== TOKENS ===================== */
  :root{
    --bg:#0E091C;
    --bg-1:#130C26;
    --bg-2:#181030;
    --bg-3:#1F1640;
    --surface:#150E2B;
    --surface-hi:#1C1440;
    --line:rgba(221,215,254,0.10);
    --line-2:rgba(221,215,254,0.16);
    --line-strong:rgba(110,84,255,0.42);

    --primary:#6E54FF;
    --primary-2:#8B76FF;
    --primary-soft:#DDD7FE;
    --primary-12:rgba(110,84,255,0.12);
    --primary-20:rgba(110,84,255,0.20);
    --primary-40:rgba(110,84,255,0.40);

    --cyan:#85E6FF;
    --blue:#B9E3F9;
    --pink:#FF8EE4;
    --amber:#FFAE45;

    --ink:#FFFFFF;
    --ink-1:#F3F1FB;
    --ink-2:#B7B1D4;
    --ink-3:#7E789B;
    --ink-4:#544E70;

    --ok:#85E6FF;
    --warn:#FFAE45;
    --bad:#FF8EE4;

    --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
    --mono:'Roboto Mono',ui-monospace,monospace;
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
    --shadow:0 24px 60px -20px rgba(0,0,0,0.7);
    --glow:0 0 0 1px var(--primary-40), 0 0 40px -6px rgba(110,84,255,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink-1);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  ::selection{background:var(--primary-40);color:#fff;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* atmospheric bg */
  .bg-aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-aura::before{content:"";position:absolute;width:900px;height:900px;left:-200px;top:-340px;
    background:radial-gradient(circle,rgba(110,84,255,0.20),transparent 62%);filter:blur(20px);}
  .bg-aura::after{content:"";position:absolute;width:760px;height:760px;right:-220px;bottom:-300px;
    background:radial-gradient(circle,rgba(133,230,255,0.10),transparent 62%);filter:blur(20px);}

  /* ===================== TYPE ===================== */
  .display{font-family:var(--display);font-weight:600;letter-spacing:-0.03em;line-height:0.98;color:var(--ink);}
  .h-xl{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,86px);letter-spacing:-0.035em;line-height:0.96;color:var(--ink);}
  .h-lg{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,52px);letter-spacing:-0.03em;line-height:1.0;color:var(--ink);}
  .h-md{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);letter-spacing:-0.02em;color:var(--ink);}
  .h-sm{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-0.01em;color:var(--ink);}
  .mono{font-family:var(--mono);}
  .label{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-3);}
  .label-sm{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-3);}
  .muted{color:var(--ink-2);}
  .dim{color:var(--ink-3);}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ===================== APP SHELL ===================== */
  #root{position:relative;z-index:1;}
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 32px;}

  /* nav */
  .nav{position:sticky;top:0;z-index:60;backdrop-filter:blur(16px);
    background:linear-gradient(180deg,rgba(14,9,28,0.92),rgba(14,9,28,0.55));
    border-bottom:1px solid var(--line);}
  .nav-in{display:flex;align-items:center;gap:34px;height:72px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:26px;height:26px;display:block;}
  .brand .wordmark{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-0.02em;color:var(--ink);}
  .brand .wordmark b{color:var(--primary-2);}
  .nav-tabs{display:flex;gap:6px;align-items:center;}
  .nav-tab{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);
    padding:9px 14px;border-radius:var(--r-pill);transition:.18s;position:relative;}
  .nav-tab:hover{color:var(--ink-1);}
  .nav-tab.active{color:var(--ink);background:var(--primary-12);}
  .nav-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-left:7px;vertical-align:middle;box-shadow:0 0 8px var(--cyan);}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:14px;}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--display);
    font-weight:600;font-size:15px;letter-spacing:-0.01em;border-radius:var(--r-pill);padding:13px 26px;transition:.18s;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 30px -10px rgba(110,84,255,0.8);}
  .btn-primary:hover{background:var(--primary-2);transform:translateY(-1px);box-shadow:0 16px 38px -12px rgba(110,84,255,0.9);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{background:rgba(221,215,254,0.06);color:var(--ink-1);border:1px solid var(--line-2);}
  .btn-ghost:hover{background:rgba(221,215,254,0.1);border-color:var(--line-strong);}
  .btn-dark{background:#0B0717;color:var(--ink);border:1px solid var(--line-2);}
  .btn-dark:hover{border-color:var(--line-strong);}
  .btn-lg{padding:18px 34px;font-size:17px;}
  .btn-block{width:100%;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);}
  .card-hi{background:var(--surface-hi);}

  /* pills / badges */
  .pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--ink-2);}
  .pill.ok{color:var(--cyan);border-color:rgba(133,230,255,0.3);background:rgba(133,230,255,0.07);}
  .pill.warn{color:var(--amber);border-color:rgba(255,174,69,0.3);background:rgba(255,174,69,0.07);}
  .pill.bad{color:var(--pink);border-color:rgba(255,142,228,0.3);background:rgba(255,142,228,0.07);}
  .pill.pri{color:var(--primary-soft);border-color:var(--line-strong);background:var(--primary-12);}

  /* token & avatar */
  .tk{border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:600;color:#fff;overflow:hidden;}
  .tk img{width:100%;height:100%;display:block;}

  /* range slider */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--bg-3);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;border:4px solid var(--primary);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:.15s;}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--primary);cursor:pointer;}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:10px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-track{background:transparent;}

  .fade-in{animation:fadeIn .42s cubic-bezier(.2,.7,.2,1);}
  @keyframes fadeIn{from{transform:translateY(10px);}to{transform:none;}}
  .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{transform:translateY(16px);}to{transform:none;}}

  /* ===================== MODAL / OVERLAY ===================== */
  .overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:28px;
    background:rgba(7,4,16,0.72);backdrop-filter:blur(8px);animation:ovIn .22s ease;}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  .modal{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);
    box-shadow:var(--shadow);animation:modalIn .34s cubic-bezier(.2,.8,.2,1);}
  @keyframes modalIn{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:var(--bg-1);border:1px solid var(--line-2);color:var(--ink-2);transition:.16s;}
  .icon-btn:hover{border-color:var(--line-strong);color:var(--ink);}

  @media (max-width:920px){
    .grid-2{grid-template-columns:1fr !important;}
    .builder-grid{grid-template-columns:1fr !important;}
  }
  @media (max-width:760px){
    .wrap{padding:0 18px;}
    .nav-tabs{display:none;}
  }
</style>
</head>
<body>
<div class="bg-aura"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mfi-data.jsx"></script>
<script type="text/babel" src="mfi-builder.jsx"></script>
<script type="text/babel" src="mfi-earn.jsx"></script>
<script type="text/babel" src="mfi-arena.jsx"></script>
<script type="text/babel" src="mfi-screens.jsx"></script>
<script type="text/babel" src="mfi-app.jsx"></script>
</body>
</html>
